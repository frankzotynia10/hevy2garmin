name: Build & Deploy Image

# Builds ghcr.io/frankzotynia10/hevy2garmin on every push to main (after tests),
# then asks n8n to redeploy on Andromeda. Before this workflow the image was
# built by hand, so merged fixes never reached the running container.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/frankzotynia10/hevy2garmin:latest
            ghcr.io/frankzotynia10/hevy2garmin:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger n8n deploy (pulls hevy2garmin on Andromeda)
        env:
          N8N_DEPLOY_SECRET: ${{ secrets.N8N_DEPLOY_SECRET }}
        run: |
          if [ -z "$N8N_DEPLOY_SECRET" ]; then
            echo "::warning::N8N_DEPLOY_SECRET not set on this repo; image pushed but not deployed. Run 'docker compose pull && docker compose up -d' in the hevy2garmin compose project."
            exit 0
          fi
          curl -fsS -X POST https://n8n.mayfairlabs.cloud/webhook/fitness-deploy \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: $N8N_DEPLOY_SECRET" \
            -d '{"repo": "${{ github.repository }}", "commit": "${{ github.sha }}", "ref": "${{ github.ref }}", "triggered_by": "${{ github.actor }}"}'
